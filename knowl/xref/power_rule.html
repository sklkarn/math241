<h4 class="heading"><span class="type">Paragraph</span></h4>
<div class="para logical">
<div class="para"> <dfn class="terminology">Power Rule:</dfn> If <span class="process-math">\(f(x) = x^n\)</span> where <span class="process-math">\(n\)</span> is a real number and <span class="process-math">\(x^n\)</span> is defined, then</div>
<div class="displaymath process-math">
\begin{equation*}
f'(x) = \frac{\,d}{\,dx}(x^n) = nx^{n-1}
\end{equation*}
</div>
<div class="para">provided <span class="process-math">\(x \neq 0\)</span> if <span class="process-math">\(n \leq 0\text{.}\)</span>
</div>
