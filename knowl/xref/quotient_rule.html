<div class="para"> <dfn class="terminology">Quotient Rule:</dfn>  If <span class="process-math">\(f(x) = \frac{g(x)}{h(x)} =\frac{u}{v}\)</span> with <span class="process-math">\(h(x) \neq 0\)</span> and both differentiable, then</div>
<div class="displaymath process-math">
\begin{equation*}
f'(x)=g'(x)h(x)-g(x)h'(x)[h(x)]^2 = \frac{u'v-uv'}{v^2}.
\end{equation*}
