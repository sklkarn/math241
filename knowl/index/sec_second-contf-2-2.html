<div class="para">A function is said to be continuous  at <span class="process-math">\(x=a,\)</span> if [<a href="sec_second-intro.html#crv5" class="xref" data-knowl="./knowl/xref/crv5.html" data-reveal-label="Reveal" data-close-label="Close" title="Figure 2.1.10">Figure 2.1.10</a>]</div>

\begin{equation*}
\lim_{x\to a} f(x) = f(a).
\end{equation*}

<div class="para">i.e.,</div>

\begin{equation*}
\lim_{x\to a^-} f(x) = \lim_{x\to a^+} f(x)= f(a).
