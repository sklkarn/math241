<h3 class="heading"><span class="type">Paragraph</span></h3>
<div class="para logical">
<div class="para"> The function <span class="process-math">\(f(x)\)</span> is continuous at a point <span class="process-math">\(x=a,\)</span> if</div>
<div class="displaymath process-math">
\begin{equation}
\lim_{x\to a} f(x) = f(a)\tag{4.5.1}
\end{equation}
</div>
<div class="para">Which also means Left hand derivative is equal to right hand derivative.</div>
<div class="displaymath process-math">
\begin{equation}
LHL\vert_a =  RHL\vert_a = f(a)\tag{4.5.2}
\end{equation}
</div>
